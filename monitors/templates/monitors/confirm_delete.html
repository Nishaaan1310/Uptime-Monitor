{% extends "users/layout.html" %}
{% block content %}
<h2>Delete Monitor</h2>
<p> Are you sure meant to delete <strong> {{ monitor.name }} </strong> ({{ monitor.url }})</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, delete</button>
    <a href="{% url 'monitors:dashboard' %}"> Cancel </a>
</form>
{% endblock %}

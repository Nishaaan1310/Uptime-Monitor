{% extends "users/layout.html" %}
{% block content %}
<h2>Log In</h2>

{% if form.errors %}
<p class="error-alert"> Your email and password combination was invalid. Please try again. </p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Log In</button>
</form>

<p> Dont have an account? <a href="{% url 'users:signup' %}">Sign up here</a>.</p>
{% endblock %}
